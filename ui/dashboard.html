      item.innerHTML = `
        <div class="nh">${t ? `<span class="t">${esc(t)}</span>` : ''}</div>
        <div class="nedit">
          <textarea class="ipt"></textarea>
          <div class="row" style="margin-top:6px">
            <button class="exe" data-save="1">SIMPAN</button>
            <button class="sec" data-cancel="1">BATAL</button>
          </div>
        </div>`;
      const ta = item.querySelector('textarea');
      ta.value = cur.text || '';
      ta.focus();
      item.querySelector('[data-save]').addEventListener('click', async () => {
        const text = ta.value.trim();
        if (!text) { toast('Catatan kosong', true); return; }
        try {
          toolOut(await api('/notes/update', { project: proj, index: i, text }));
          await refreshNotes(proj); paint();
          toast('Catatan diperbarui');
        } catch (e) { toast('Gagal: ' + e.message, true); }
      });
      item.querySelector('[data-cancel]').addEventListener('click', paint);
    }));
    list.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      const item = b.closest('.noteitem');
      const proj = item.dataset.proj, i = +item.dataset.i;
      const cur = (state.notes[proj] || [])[i] || {};
      if (!confirm('Hapus catatan ini?\n\n' + String(cur.text || '').slice(0, 160))) return;
      try {
        toolOut(await api('/notes/delete', { project: proj, index: i }));
        await refreshNotes(proj); paint();
        toast('Catatan dihapus');
      } catch (e) { toast('Gagal: ' + e.message, true); }
    }));
  };

  const curProj = () => state.active || (d.querySelector('#nt-project') ? d.querySelector('#nt-project').value : '');
  d.querySelector('#nt-add').addEventListener('click', async () => {
    const proj = curProj(), text = d.querySelector('#nt-text').value.trim();
    if (!proj) { toast('Pilih project dulu', true); return; }
    if (!text) { toast('Catatan masih kosong', true); return; }
    try {
      toolOut(await api('/notes', { project: proj, text }));
      d.querySelector('#nt-text').value = '';
      await refreshNotes(proj);
      paint();
      toast('Catatan ditambahkan');
    } catch (e) { toast('Gagal: ' + e.message, true); }
  });
  if (d.querySelector('#nt-project')) d.querySelector('#nt-project').addEventListener('change', paint);
  paint();
}

/* ---------- view: Prompts ---------- */
function renderPrompts(d) {
  const lm = state._lm || [];
  const item = (state.sel != null) ? lm[state.sel] : null;
  if (!item || item.kind !== 'prompt') {
    const n = (state.prompts || []).filter(x =>
      state.active ? x.name.indexOf(state.active + '/') === 0 : true).length;
    d.innerHTML = `
      <div class="dhead"><h2>Prompts <span class="tag">PROYEK</span></h2>
        <p>Prompt template per project (<code>.mcp/prompts/</code>). Pilih satu di kolom kiri untuk mengisi argumen lalu menjalankannya.</p></div>
      ${ctxStrip()}
      <div class="wide"><div class="hint">${n} prompt tersedia. Pilih dari kolom kiri.</div></div>`;
    wireCtx(d);
    return;
  }
  const p = (state.prompts || []).find(x => x.name === item.name);
  if (!p) { d.innerHTML = '<div class="empty">prompt tidak ditemukan</div>'; return; }
  d.innerHTML = ctxStrip();
  const box = document.createElement('div');
  d.appendChild(box);
  renderPromptDetail(box, p, state.sel);
  wireCtx(d);
}

/* ---------- view: Ringkasan ---------- */
function renderOverview(d) {
  if (!state.active) return renderPortfolio(d);
  const p = projObj() || {};
  const docs = state.docs[state.active] || [];
  const notes = state.notes[state.active] || [];
  const prompts = (state.prompts || []).filter(x => x.name.indexOf(state.active + '/') === 0);
  const provs = state.providers || [];
  const card = (label, val, sub, bad) =>
    `<div class="hm-card${bad ? ' bad' : ''}"><div class="hm-v">${esc(val)}</div>
     <div class="hm-l">${esc(label)}</div>${sub ? `<div class="hm-s">${esc(sub)}</div>` : ''}</div>`;
  d.innerHTML = `
    <div class="dhead"><h2>${esc(p.project || state.active)} <span class="tag">RINGKASAN</span></h2>
      <p>Dokumen, catatan, dan tim untuk proyek ini.</p></div>
    ${ctxStrip()}
    <div class="wide">
      ${workspaceHero()}
      <div class="hm-grid">
        ${card('Dokumen', docs.length, docs.join(', ') || 'belum ada')}
        ${card('Catatan', notes.length, notes.length ? ('terbaru: ' + ((notes[notes.length - 1].time) || '')) : 'belum ada')}
        ${card('Prompt', prompts.length, 'template project')}
        ${card('Provider', provs.length, provs.join(', ') || 'belum aktif', !provs.length)}
      </div>
      ${quickActions()}
      <div class="section">
        <div class="dlabel">JELAJAHI WORKSPACE</div>
        <div class="pillrow">
          <button class="exe" data-go="p-chat">Chat</button>
          <button class="sec" data-go="p-orch">Orchestrate</button>
          <button class="sec" data-go="p-docs">Docs</button>
          <button class="sec" data-go="p-notes">Catatan</button>
          <button class="sec" data-go="p-prompts">Prompts</button>
        </div>
      </div>
      <div class="section">
        <div class="dlabel">LOKASI PROJECT</div>
        <dl class="kv">
          <dt>nama</dt><dd>${esc(p.project || state.active)}</dd>
          <dt>path</dt><dd>${esc(p.path || '-')}</dd>
          <dt>status</dt><dd>${p.active ? 'aktif' : 'tidak aktif'}</dd>
        </dl>
      </div>
      <div class="section">
        <div class="dlabel">BERKAS PROJECT<span class="hint" id="ov-fs-info"></span></div>
        <div class="filelist" id="ov-files"><span class="hint">memuat...</span></div>
      </div>
      ${(state.hist || []).length ? `<div class="section"><div class="dlabel">AKTIVITAS TERAKHIR</div>
        <div class="tl" style="max-width:720px">${state.hist.slice(0, 6).map(h =>
          `<div class="turn ${h.err ? 'reviewer' : 'architect'}"><div class="th"><b>${esc(h.label)}</b>
           <span class="prov">${h.ms} ms${h.err ? ' · err' : ''}</span></div></div>`).join('')}</div></div>` : ''}
    </div>`;
  mountOverviewStage();
  wireCtx(d);
  d.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    const btn = document.querySelector(`nav button[data-v="${b.dataset.go}"]`);
    if (btn) btn.click();
  }));
  (async () => {
    try {
      const r = await api('/fs?path=' + encodeURIComponent(p.path || ''));
      const dirs = r.dirs || [], files = r.files || [];
      const box = d.querySelector('#ov-files'); if (!box) return;
      box.innerHTML = (dirs.map(x => `<span class="chip" style="border-color:var(--line2);color:var(--amber)">${esc(x)}/</span>`).join('')
        + files.map(x => `<span class="chip">${esc(x)}</span>`).join('')) || '<span class="hint">folder kosong</span>';
      const info = d.querySelector('#ov-fs-info');
      if (info) info.textContent = ` — ${dirs.length} folder, ${files.length} berkas`;
    } catch (e) {
      const box = d.querySelector('#ov-files');
      if (box) box.innerHTML = '<span class="hint">gagal membaca folder</span>';
    }
  })();
}

/* ---------- view: Semua Proyek (portfolio) ---------- */
function renderPortfolio(d) {
  const ps = state.projects || [];
  const provs = state.providers || [];
  d.innerHTML = `
    <div class="dhead"><h2>Semua Proyek <span class="tag">${ps.length}</span></h2>
      <p>Semua konten dikelompokkan per project. Pilih satu project untuk fokus, atau buat yang baru.</p></div>
    ${ctxStrip(`<button class="exe" id="ov-new">+ PROYEK BARU</button>`)}
    <div class="wide">
      ${workspaceHero(true)}
      ${ps.length ? `<div class="pgrid">${ps.map(p => {
        const docs = (state.docs[p.project] || []).length;
        const notes = (state.notes[p.project] || []).length;
        const prms = (p.prompts || []).length;
        return `<div class="pcard" data-open="${esc(p.project)}">
          <div class="t"><b>${esc(p.project)}</b>
            ${p.active ? '<span class="badge ok">aktif</span>' : ''}
            ${p.exists === false ? '<span class="badge warn">folder hilang</span>' : ''}</div>
          <div class="p">${esc(p.path || '')}</div>
          <div class="m"><span>docs <b>${docs}</b></span><span>catatan <b>${notes}</b></span>
            <span>prompt <b>${prms}</b></span></div>
        </div>`;
      }).join('')}</div>` : '<div class="hint">Belum ada project terdaftar. Buat project pertama lewat tombol di atas.</div>'}
      <div class="section">
        <div class="hint">${provs.length ? ('Provider aktif: ' + esc(provs.join(', ')))
          : 'Belum ada provider LLM aktif — menjalankan agen akan memakai mode simulasi.'}</div>
      </div>
    </div>`;
  mountOverviewStage();
  wireCtx(d);
  wireQuickActions(d);
  const nb = d.querySelector('#ov-new'); if (nb) nb.addEventListener('click', openNewProject);
  d.querySelectorAll('[data-open]').forEach(el =>
    el.addEventListener('click', () => selectProject(el.dataset.open)));
}

/* ---------- boot ---------- */
async function boot() {
  $('#pane-detail').innerHTML = '<div class="empty" role="status">Memuat workspace…</div>';
  await loadServer();
  const [t, rsc, p] = await Promise.all([api('/tools'), api('/resources'), api('/prompts')]);
  state.tools = t.tools || [];
  state.resources = rsc.resources || [];
  state.prompts = p.prompts || [];
  await Promise.all([loadAgents(), loadProviders(), loadProjects()]);
  const act = (state.projects || []).find(x => x.active);
  state.active = act ? act.project : "";
  await loadProjectData();
  renderProjectBar();
  updateNavCounts();
  $('#pane-list').classList.toggle('hidden', !LIST_VIEWS.has(state.view));
  if (LIST_VIEWS.has(state.view)) renderList();
  renderDetail();
}

document.querySelector('#proj-switch').addEventListener('change', e => selectProject(e.target.value));
document.querySelector('#proj-new').addEventListener('click', openNewProject);
async function startWorkspace() {
  try { await boot(); }
  catch (e) {
    $('#pane-detail').innerHTML = `<div class="empty"><h2>Workspace belum terhubung</h2><p>${esc(e.message)}</p><button class="exe" id="retry-boot">Coba lagi</button></div>`;
    $('#retry-boot').onclick = startWorkspace;
  }
}
// Give dynamically rendered list items keyboard parity with pointer controls.
new MutationObserver(() => {
  document.querySelectorAll('.form-grid, .field, .fg').forEach(row => { const label = row.querySelector('label'), input = row.querySelector('input, textarea, select'); if (label && input && input.id) label.htmlFor = input.id; });
  document.querySelectorAll('.dhead:not([data-section])').forEach(el => { el.dataset.section = ({'p-overview':'OVERVIEW','p-chat':'CHAT','p-orch':'ORCHESTRATION','p-docs':'DOCUMENTS','p-notes':'NOTES','p-prompts':'PROMPTS','s-agents':'AGENTS','s-providers':'CONNECTIONS','s-tools':'TOOL EXPLORER','s-resources':'RESOURCES','s-server':'SYSTEM'})[state.view] || 'STUDIO'; });
  document.querySelectorAll('.item[data-i], .pcard[data-open], .acard[data-edit], .acard[data-pedit]').forEach(el => {
    el.tabIndex = 0; el.setAttribute('role', 'button');
  });
}).observe($('#workspace'), {childList:true, subtree:true});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.item[data-i], .pcard[data-open], .acard[data-edit], .acard[data-pedit]')) {
    e.preventDefault(); e.target.click();
  }
});
window.addEventListener('unhandledrejection', event => { toast(event.reason?.message || 'Operasi gagal. Coba lagi.', true); });
startWorkspace();
</script>
</body>
</html>
