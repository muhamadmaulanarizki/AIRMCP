<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AirMCP Studio — AI Workspace</title>
<style>
  /* ============================================================
     AIRMCP OPS CONSOLE — industrial mono aesthetic
     no gradients / no glow / no emoji / hairline borders
     ============================================================ */
  :root {
    --bg:      #0e120f;
    --panel:   #131a16;
    --panel2:  #182019;
    --line:    #242e27;
    --line2:   #2e3a32;
    --text:    #d7e0d9;
    --dim:     #78877d;
    --faint:   #4a564f;
    --acid:    #c8f65d;
    --amber:   #e3c078;
    --err:     #e0707a;
    --ok:      #8fd98f;
    --r:       3px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, "SF Mono", monospace;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  ::selection { background: var(--acid); color: #0e120f; }

  /* ---------- top bar ---------- */
  header {
    display:flex; align-items:center; gap:16px;
    height:46px; padding:0 16px;
    border-bottom:1px solid var(--line);
    flex:none;
  }
  .brand { font-weight:700; letter-spacing:.12em; }
  .brand em { font-style:normal; color:var(--acid); }
  .brand-sub { color:var(--faint); font-size:11px; letter-spacing:.08em; }
  .top-status { margin-left:auto; display:flex; gap:10px; align-items:center; }
  .stat {
    border:1px solid var(--line); border-radius:var(--r);
    padding:3px 10px; font-size:11px; color:var(--dim);
    letter-spacing:.06em;
  }
  .stat b { color:var(--text); font-weight:600; }
  .stat.on  { border-color:var(--line2); }
  .stat.on b::before { content:"■ "; color:var(--acid); }
  .stat.err b::before { content:"■ "; color:var(--err); }

  /* ---------- layout ---------- */
  .shell { flex:1; display:flex; min-height:0; }
  nav {
    width:172px; flex:none;
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    padding:10px 0;
  }
  nav .grp { padding:10px 12px 4px; font-size:10px; letter-spacing:.18em; color:var(--faint); }
  nav button {
    all:unset; cursor:pointer; display:flex; align-items:baseline; gap:8px;
    padding:7px 12px; color:var(--dim);
    border-left:2px solid transparent;
  }
  nav button:hover { color:var(--text); background:var(--panel); }
  nav button.active {
    color:var(--text); background:var(--panel);
    border-left-color:var(--acid);
  }
  nav button .n { color:var(--faint); font-size:11px; }
  nav .foot {
    margin-top:auto; padding:12px; border-top:1px solid var(--line);
    font-size:10.5px; color:var(--faint); line-height:1.7;
  }
  nav .foot b { color:var(--dim); font-weight:600; }

  main { flex:1; min-width:0; display:flex; }

  /* ---------- master list ---------- */
  .list {
    width:290px; flex:none; border-right:1px solid var(--line);
    overflow-y:auto; background:var(--bg);
  }
  .list-h {
    padding:10px 14px 8px;
    font-size:10px; letter-spacing:.18em; color:var(--faint);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg);
    display:flex; justify-content:space-between;
  }
  .list-h .cnt { color:var(--dim); letter-spacing:0; }
  .item {
    display:flex; gap:10px; align-items:baseline;
    padding:9px 14px; cursor:pointer;
    border-bottom:1px solid color-mix(in srgb, var(--line) 55%, transparent);
  }
  .item:hover { background:var(--panel); }
  .item.active { background:var(--panel2); }
  .item.active::before {
    content:""; position:absolute; left:0; width:2px; height:26px; background:var(--acid);
  }
  .item { position:relative; }
  .item .idx { color:var(--faint); font-size:10.5px; width:18px; flex:none; }
  .item .nm { font-weight:600; }
  .item .ds {
    color:var(--dim); font-size:11.5px; margin-left:auto;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:120px;
  }
  .urirow { padding:10px 14px; border-bottom:1px solid var(--line); }
  .urirow .lbl { font-size:10px; letter-spacing:.15em; color:var(--faint); margin-bottom:6px; }
  .urirow .row { display:flex; gap:8px; }

  /* ---------- detail panes ---------- */
  .detail { flex:1; min-width:0; display:flex; flex-direction:column; overflow-y:auto; }
  .dhead { padding:18px 22px 0; }
  .dhead h2 { font-size:15px; letter-spacing:.04em; display:flex; align-items:baseline; gap:10px; }
  .dhead h2 .tag {
    font-size:10px; color:var(--acid); border:1px solid var(--line2);
    padding:2px 7px; border-radius:var(--r); letter-spacing:.1em; font-weight:400;
  }
  .dhead p { color:var(--dim); margin-top:6px; max-width:640px; }
  .dsection { padding:16px 22px; }
  .dlabel { font-size:10px; letter-spacing:.18em; color:var(--faint); margin-bottom:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip {
    font-size:10.5px; padding:2px 8px; border-radius:var(--r);
    border:1px solid var(--line); color:var(--dim);
  }
  .chip.req { border-color:var(--amber); color:var(--amber); }

  .fields { display:flex; flex-direction:column; gap:9px; max-width:620px; }
  .field { display:grid; grid-template-columns:130px 1fr; gap:10px; align-items:center; }
  .field label { font-size:11.5px; color:var(--dim); }
  .field label .t { color:var(--faint); font-size:10px; margin-left:5px; }
  .field label .req { color:var(--amber); }
  input[type=text], textarea {
    font:inherit; font-size:12.5px;
    background:var(--panel); color:var(--text);
    border:1px solid var(--line2); border-radius:var(--r);
    padding:7px 10px; outline:none; width:100%;
  }
  input[type=text]:focus, textarea:focus { border-color:var(--acid); }
  textarea { min-height:120px; resize:vertical; font-size:12px; }

  .actions { display:flex; gap:8px; padding:4px 22px 14px; max-width:620px; }
  button.exe {
    all:unset; cursor:pointer;
    border:1px solid var(--acid); color:var(--acid);
    padding:7px 16px; border-radius:var(--r);
    font:inherit; font-size:12px; letter-spacing:.08em;
  }
  button.exe:hover { background:var(--acid); color:#0e120f; }
  button.exe:disabled { opacity:.45; cursor:wait; }
  button.sec {
    all:unset; cursor:pointer;
    border:1px solid var(--line2); color:var(--dim);
    padding:7px 12px; border-radius:var(--r); font:inherit; font-size:12px;
  }
  button.sec:hover { color:var(--text); border-color:var(--dim); }
  kbd {
    border:1px solid var(--line2); border-bottom-width:2px; border-radius:2px;
    padding:0 4px; font-size:10px; color:var(--dim);
  }

  /* ---------- console / result ---------- */
  .console { border-top:1px solid var(--line); background:#0b0f0d; }
  .console-h {
    display:flex; align-items:center; gap:10px;
    padding:8px 22px; border-bottom:1px solid var(--line);
    font-size:10px; letter-spacing:.18em; color:var(--faint);
  }
  .console-h .lat { letter-spacing:0; color:var(--dim); margin-left:auto; }
  .console-h .tag-err { color:var(--err); }
  .console-h .tag-ok { color:var(--ok); }
  .console pre {
    padding:14px 22px; overflow:auto; max-height:340px;
    font-size:12px; line-height:1.55;
  }
  .console pre .k { color:var(--dim); }
  .console pre .s { color:var(--acid); }
  .console pre .num { color:var(--amber); }
  .console pre .bool { color:var(--err); }
  .hist { padding:8px 22px 16px; display:flex; flex-wrap:wrap; gap:6px; }
  .hist span {
    font-size:10.5px; border:1px solid var(--line); border-radius:var(--r);
    padding:2px 8px; color:var(--dim);
  }
  .hist span b { color:var(--text); font-weight:500; }
  .hist span.err { border-color:color-mix(in srgb, var(--err) 40%, var(--line)); }

  .empty {
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--faint); font-size:12px; letter-spacing:.06em;
  }
  .hidden { display:none !important; }
  .spinner {
    display:inline-block; width:11px; height:11px;
    border:1.5px solid var(--line2); border-top-color:var(--acid);
    border-radius:50%; animation:spin .7s linear infinite; margin-right:6px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ---------- orchestrate / agents / providers ---------- */
  .wide { padding:16px 22px 26px; max-width:980px; }
  .form-grid { display:grid; grid-template-columns:110px 1fr; gap:10px; align-items:start; margin-bottom:11px; }
  .form-grid label { color:var(--dim); font-size:12px; padding-top:7px; }
  select, .ipt {
    font:inherit; font-size:12.5px; background:var(--panel); color:var(--text);
    border:1px solid var(--line2); border-radius:var(--r); padding:7px 10px; width:100%; outline:none;
  }
  select:focus, .ipt:focus { border-color:var(--acid); }
  .hint { color:var(--faint); font-size:11px; margin-top:5px; }
  .pathbox { font-size:11.5px; color:var(--acid); border:1px dashed var(--line2); border-radius:var(--r); padding:6px 9px; word-break:break-all; margin-top:6px; }
  .row { display:flex; gap:8px; align-items:center; }
  .pillrow { display:flex; flex-wrap:wrap; gap:6px; }
  .pill { font-size:11px; border:1px solid var(--line2); border-radius:var(--r); padding:4px 9px; color:var(--dim); cursor:pointer; user-select:none; }
  .pill:hover { color:var(--text); }
  .pill.on { border-color:var(--acid); color:var(--acid); }
  .runbar { display:flex; gap:10px; align-items:center; margin:14px 0; flex-wrap:wrap; }
  .badge { font-size:10px; border:1px solid var(--line2); border-radius:var(--r); padding:2px 7px; color:var(--dim); letter-spacing:.08em; }
  .badge.warn { border-color:var(--amber); color:var(--amber); }
  .badge.ok { border-color:var(--acid); color:var(--acid); }
  .stage-wrap { border:1px solid var(--line); border-radius:var(--r); background:#0b0f0d; margin:8px 0 14px; }
  .stage-wrap .cap { padding:6px 12px; border-bottom:1px solid var(--line); font-size:10px; letter-spacing:.18em; color:var(--faint); display:flex; }
  .stage-wrap .cap .r { margin-left:auto; letter-spacing:0; }
  #stage { display:block; width:100%; height:420px; }
  .tl { display:flex; flex-direction:column; gap:9px; margin-top:6px; }
  .turn { border:1px solid var(--line); border-left-width:3px; border-radius:var(--r); background:var(--panel); opacity:.35; transition:opacity .2s; }
  .turn.live { opacity:1; }
  .turn .th { display:flex; align-items:center; gap:8px; padding:6px 12px; border-bottom:1px solid var(--line); }
  .turn .th b { font-weight:600; }
  .turn .th .prov { margin-left:auto; font-size:10px; color:var(--faint); letter-spacing:.1em; }
  .turn .tc { padding:10px 12px; white-space:pre-wrap; font-size:12px; color:var(--text); font-family:inherit; }
  .turn.architect { border-left-color:var(--acid); }
  .turn.coder { border-left-color:var(--amber); }
  .turn.reviewer { border-left-color:var(--err); }
  .turn.tester { border-left-color:var(--ok); }
  .acard { border:1px solid var(--line); border-radius:var(--r); padding:11px 13px; margin-bottom:8px; background:var(--panel); }
  .acard .top { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
  .acard .top b { font-weight:600; }
  .acard .sys { color:var(--dim); font-size:11.5px; margin-top:6px; }
  .acard .x { margin-left:auto; cursor:pointer; color:var(--faint); border:1px solid var(--line2); border-radius:var(--r); padding:1px 8px; font-size:11px; }
  .acard .x:hover { color:var(--err); border-color:var(--err); }
  /* ---------- filesystem browser modal ---------- */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal .box { width:min(700px,94vw); height:min(560px,86vh); background:var(--panel); border:1px solid var(--line2); border-radius:var(--r); display:flex; flex-direction:column; }
  .modal .mh { display:flex; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); }
  .modal .mh .p { flex:1; color:var(--acid); font-size:12px; word-break:break-all; }
  .modal .ml { flex:1; overflow:auto; padding:6px; }
  .modal .me { padding:5px 10px; cursor:pointer; border-radius:var(--r); display:flex; gap:8px; align-items:center; font-size:12.5px; }
  .modal .me:hover { background:var(--panel2); }
  .modal .me .ic { width:16px; color:var(--dim); flex:none; }
  .modal .me.dir .ic { color:var(--amber); }
  .modal .me.file .ic { color:var(--faint); }
  .modal .mfoot { display:flex; gap:8px; justify-content:flex-end; padding:10px 12px; border-top:1px solid var(--line); }
  .modal .crumb { color:var(--faint); font-size:11px; padding:4px 10px; }
  /* ---------- chat ---------- */
  .chatwrap { display:flex; flex-direction:column; height:calc(100vh - 46px); }
  .chat-log { flex:1; overflow-y:auto; padding:16px 22px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:820px; }
  .msg .who { font-size:10px; letter-spacing:.14em; color:var(--faint); margin-bottom:4px; }
  .msg .body { border:1px solid var(--line); border-radius:var(--r); padding:10px 13px; background:var(--panel); font-size:13px; line-height:1.6; }
  .msg.user { align-self:flex-end; }
  .msg.user .body { border-color:var(--line2); background:var(--panel2); }
  .msg.assistant .body { border-left:2px solid var(--acid); }
  .msg .body h1,.msg .body h2,.msg .body h3,.msg .body h4 { margin:8px 0 4px; font-size:14px; }
  .msg .body pre.code { background:#0b0f0d; border:1px solid var(--line); border-radius:var(--r); padding:10px; overflow:auto; margin:8px 0; font-size:12px; line-height:1.5; }
  .msg .body code { background:#0b0f0d; padding:1px 5px; border-radius:2px; font-size:12px; }
  .msg .body ul { margin:6px 0 6px 20px; }
  .msg .body i { color:var(--dim); }
  .msg .meta { font-size:10px; color:var(--faint); margin-top:4px; }
  .chatbar { border-top:1px solid var(--line); padding:12px 22px; display:flex; gap:8px; align-items:flex-end; }
  .chatbar textarea { min-height:52px; max-height:180px; }
  #chat-stage { display:block; width:100%; height:210px; }
  .docbox { border:1px solid var(--line); border-radius:var(--r); background:var(--panel); padding:14px 16px; margin-top:10px; max-height:520px; overflow:auto; font-size:13px; line-height:1.6; }
  .docbox h1,.docbox h2,.docbox h3 { font-size:14px; margin:10px 0 4px; }
  .docbox pre.code { background:#0b0f0d; border:1px solid var(--line); border-radius:var(--r); padding:10px; overflow:auto; }
  .docbox ul { margin:6px 0 6px 20px; }
  .noteitem { border-left:2px solid var(--amber); padding:6px 10px; margin-bottom:6px; background:var(--panel); font-size:12.5px; }
  .noteitem .t { color:var(--faint); font-size:10px; display:block; margin-bottom:2px; }
  /* ---------- home / manage ---------- */
  .hm-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:10px; }
  .hm-card { border:1px solid var(--line); border-radius:var(--r); background:var(--panel); padding:13px 15px; }
  .hm-v { font-size:23px; color:var(--acid); font-weight:600; line-height:1.1; }
  .hm-l { font-size:10px; letter-spacing:.16em; color:var(--faint); margin-top:3px; }
  .hm-s { font-size:11px; color:var(--dim); margin-top:5px; }
  .hm-card.bad .hm-v { color:var(--amber); }
  .list-search { padding:8px 10px; border-bottom:1px solid var(--line); background:var(--bg); }
  .list-search input { width:100%; }
  .toast { position:fixed; right:18px; bottom:18px; z-index:90; display:flex; flex-direction:column; gap:8px; }
  .toast .t { background:var(--panel2); border:1px solid var(--line2); border-left:3px solid var(--acid);
    border-radius:var(--r); padding:9px 13px; font-size:12.5px; color:var(--text);
    box-shadow:0 8px 24px rgba(0,0,0,.4); min-width:210px; max-width:360px; transition:opacity .3s; }
  .toast .t.err { border-left-color:var(--err); }
  .editing { outline:1px dashed var(--amber); outline-offset:2px; }

  /* ---------- project switcher (header) ---------- */
  .pbar { display:flex; align-items:center; gap:8px; }
  .pbar .lbl { font-size:10px; letter-spacing:.16em; color:var(--faint); }
  .pbar select { width:auto; min-width:200px; max-width:300px; padding:4px 8px; font-size:12px; }
  .pbar button { all:unset; cursor:pointer; border:1px solid var(--line2); color:var(--dim);
    padding:4px 9px; border-radius:var(--r); font-size:11.5px; }
  .pbar button:hover { color:var(--text); border-color:var(--dim); }

  /* ---------- project context strip ---------- */
  .ctx { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:9px 22px; border-bottom:1px solid var(--line); background:var(--panel); }
  .ctx .nm { font-weight:600; }
  .ctx .pth { color:var(--faint); font-size:11px; word-break:break-all; }
  .ctx .sp { margin-left:auto; }

  /* ---------- grouped list ---------- */
  .pgroup { padding:9px 14px 5px; font-size:10px; letter-spacing:.16em; color:var(--acid);
    background:var(--bg); border-bottom:1px solid var(--line);
    position:sticky; top:0; }
  .pgroup .sub { color:var(--faint); letter-spacing:0; margin-left:6px; }
  .item.act { color:var(--acid); }
  .item.hintitem { color:var(--faint); cursor:default; font-size:11.5px; }
  .item .mb { margin-left:auto; font-size:11px; color:var(--faint); }

  /* ---------- portfolio cards ---------- */
  .pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(264px,1fr)); gap:12px; }
  .pcard { border:1px solid var(--line); border-radius:var(--r); background:var(--panel);
    padding:14px 15px; cursor:pointer; }
  .pcard:hover { border-color:var(--line2); background:var(--panel2); }
  .pcard .t { display:flex; align-items:baseline; gap:6px; }
  .pcard .t b { font-weight:600; }
  .pcard .t .badge { margin-left:auto; }
  .pcard .p { color:var(--faint); font-size:11px; margin-top:4px; word-break:break-all; }
  .pcard .m { display:flex; gap:14px; margin-top:9px; color:var(--dim); font-size:11.5px; }
  .pcard .m b { color:var(--text); font-weight:600; }

  /* ---------- docs / notes ---------- */
  .docmeta { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 22px; border-bottom:1px solid var(--line); background:var(--panel); }
  .docmeta .f { color:var(--acid); font-size:11.5px; word-break:break-all; }
  .docmeta .sp { margin-left:auto; }
  .noteday { font-size:10px; letter-spacing:.16em; color:var(--faint); margin:16px 0 6px; }
  .noteday:first-child { margin-top:0; }
  .noteitem { border-left:2px solid var(--amber); padding:8px 12px; margin-bottom:6px;
    background:var(--panel); font-size:12.5px; white-space:pre-wrap; }
  .noteitem .t { color:var(--faint); font-size:10px; display:block; margin-bottom:3px; }
  .noteitem .nh { display:flex; align-items:center; gap:8px; margin-bottom:3px; }
  .noteitem .nact { margin-left:auto; display:flex; gap:6px; opacity:.5; }
  .noteitem:hover .nact { opacity:1; }
  .noteitem .t { margin-bottom:0; }
  .nb { white-space:pre-wrap; }
  .minibtn { all:unset; cursor:pointer; font-size:10px; letter-spacing:.06em;
    border:1px solid var(--line2); border-radius:var(--r); padding:1px 7px; color:var(--dim); }
  .minibtn:hover { color:var(--text); border-color:var(--dim); }
  .minibtn.del:hover { color:var(--err); border-color:var(--err); }
  .nedit textarea { min-height:70px; }
  .addbar { display:flex; gap:8px; align-items:flex-start; }
  .addbar textarea { min-height:56px; }

  /* ---------- misc ---------- */
  .kv { display:grid; grid-template-columns:auto 1fr; gap:5px 16px; font-size:12px; max-width:760px; }
  .kv dt { color:var(--faint); }
  .kv dd { word-break:break-all; }
  .filelist { display:flex; flex-wrap:wrap; gap:6px; }
  .section { border-top:1px solid var(--line); margin-top:19px; padding-top:15px; }
  .modal .mf { padding:14px; display:flex; flex-direction:column; gap:11px; }
  .modal .mf .fg { display:grid; grid-template-columns:92px 1fr; gap:10px; align-items:center; }
  .modal .mf .fg label { color:var(--dim); font-size:12px; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:var(--line2); border-radius:5px; }
  ::-webkit-scrollbar-track { background:transparent; }

  /* AirMCP Studio — shared visual system across every workspace view. */
  :root { color-scheme:dark; --bg:#101117; --panel:#181a24; --panel2:#222431;
    --line:#2a2d3c; --line2:#41465c; --text:#f0f0f7; --dim:#b1b5ca; --faint:#969cb5;
    --acid:#c9b58c; --amber:#f0c58c; --err:#ff96ad; --ok:#78dfbd; --r:12px; }

  .chat-welcome .welcome-mark { background:#b7c6a314; border-color:#b7c6a340; color:#b7c6a3; }
  .orch-wide { max-width:1180px; }
  .orch-layout { display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:14px; align-items:stretch; margin:8px 0 18px; }
  .orch-layout .stage-wrap { margin:0; min-width:0; }
  .orch-side { border:1px solid #445248; border-radius:8px; background:#1d2421; overflow:hidden; display:flex; flex-direction:column; min-height:420px; }
  .orch-side-head { display:flex; align-items:center; gap:8px; padding:13px 14px; border-bottom:1px solid var(--line); }
  .orch-side-head b { font-size:11px; letter-spacing:.12em; }
  .run-count { margin-left:auto; color:var(--faint); font:10px Consolas,monospace; }
  .run-queue { padding:7px; display:flex; flex-direction:column; gap:4px; }
  .run-agent { width:100%; display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:9px; align-items:center; padding:9px; border:1px solid transparent; border-radius:7px; background:transparent; color:var(--text); text-align:left; cursor:pointer; }
  .run-agent:hover,.run-agent.selected { background:#2a3330; border-color:#465148; }
  .run-agent .status-dot { width:8px; height:8px; border-radius:50%; background:#7c877d; box-shadow:0 0 0 3px #7c877d18; }
  .run-agent.running .status-dot { background:#e6c478; box-shadow:0 0 0 4px #e6c4781f; animation:statusPulse 1.3s ease-out infinite; }
  .run-agent.done .status-dot { background:#82bea0; }.run-agent.error .status-dot { background:#d98478; }.run-agent.cancelled .status-dot { background:#756f72; }
  .run-agent strong { display:block; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .run-agent small { display:block; margin-top:2px; color:var(--faint); font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .run-agent time { color:var(--faint); font:9px Consolas,monospace; }
  .agent-inspector { margin-top:auto; padding:14px; border-top:1px solid var(--line); background:#202825; min-height:128px; }
  .agent-inspector .agent-kicker { color:#9bab9d; font:9px Consolas,monospace; letter-spacing:.14em; }
  .agent-inspector h4 { margin:5px 0 3px; font-size:17px; font-weight:550; }
  .agent-inspector p { color:var(--dim); font-size:11px; line-height:1.55; }
  .agent-meta { display:flex; flex-wrap:wrap; gap:5px; margin-top:11px; }
  .agent-meta span,.turn-signal { border:1px solid #465148; border-radius:99px; padding:3px 7px; color:#bec9ba; font-size:9px; }
  .orch-config { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr); gap:14px; margin-bottom:4px; }
  .orch-config-block { border:1px solid var(--line); border-radius:8px; background:#1d2421; padding:15px; }
  .orch-config-block .form-grid:last-child { margin-bottom:0; }
  .turn .tc { max-height:180px; overflow:hidden; position:relative; }
  .turn.expanded .tc { max-height:none; }
  .turn:not(.expanded) .tc.long::after { content:''; position:absolute; left:0; right:0; bottom:0; height:48px; background:linear-gradient(transparent,var(--panel)); pointer-events:none; }
  .turn-tools { display:flex; gap:6px; align-items:center; padding:0 16px 13px; flex-wrap:wrap; }
  .turn-tools button { margin-left:auto; border:0; background:none; color:#d5c49e; padding:3px; font-size:10px; cursor:pointer; }
  .turn-signal.bad { color:#e7a197; border-color:#91554d; }.turn-signal.good { color:#9dd1b7; border-color:#4f7e68; }
  .room-inspector { display:none; padding:13px 20px; border-top:1px solid #445248; background:#1c2421; align-items:center; gap:12px; }
  .room-inspector.on { display:flex; }.room-inspector b { font-size:12px; }.room-inspector span { color:var(--dim); font-size:11px; }.room-inspector .badge { margin-left:auto; }
  @keyframes statusPulse { 0%{box-shadow:0 0 0 0 #e6c47855} 100%{box-shadow:0 0 0 9px #e6c47800} }
  @media(max-width:900px) { .orch-layout,.orch-config { grid-template-columns:1fr; }.orch-side { min-height:0; }.agent-inspector { margin-top:0; }.run-queue { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media(max-width:700px){ .quick-card { border-right:0;border-bottom:1px solid var(--line); } }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="brand-mark">a/</span> AirMCP <small>STUDIO</small></div>
  <div class="pbar">
    <span class="lbl">PROYEK</span>
    <select id="proj-switch" aria-label="Proyek aktif"></select>
    <button id="proj-new">+ Baru</button>
  </div>
  <div class="top-status">
    <div class="stat" id="st-proto"><b>proto —</b></div>
    <div class="stat" id="st-conn"><b>connecting</b></div>
  </div>
</header>

<div class="shell">
  <nav aria-label="Navigasi utama">
    <div class="grp">PROYEK</div>
    <button class="active" data-v="p-overview"><span class="n"></span> Ringkasan</button>
    <button data-v="p-chat"><span class="n"></span> Chat</button>
    <button data-v="p-orch"><span class="n" id="n-agt"></span> Orchestrate</button>
    <button data-v="p-docs"><span class="n" id="n-docs"></span> Docs</button>
    <button data-v="p-notes"><span class="n" id="n-notes"></span> Catatan</button>
    <button data-v="p-prompts"><span class="n" id="n-prm"></span> Prompts</button>
    <div class="grp">SISTEM</div>
    <button data-v="s-agents"><span class="n" id="n-agents"></span> Agents</button>
    <button data-v="s-providers"><span class="n" id="n-prov"></span> Providers</button>
    <button data-v="s-tools"><span class="n" id="n-tools"></span> Tools</button>
    <button data-v="s-resources"><span class="n" id="n-res"></span> Resources</button>
    <button data-v="s-server"><span class="n"></span> Server</button>
    <div class="foot">
      <b>AirMCP / lokal</b><br>Proyek, agen, dan tools.<br>Tools · agen · dokumen
    </div>
  </nav>

  <main id="workspace">
    <section class="list" id="pane-list"></section>
    <section class="detail" id="pane-detail">
      <div class="empty" id="pick">Memuat workspace…</div>
    </section>
  </main>
</div>

<script src="/assets/run_state.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state = {
  tools:[], resources:[], prompts:[], projects:[], active:"", view:"p-overview",
  sel:null, hist:[], filter:{}, docs:{}, notes:{}, serverFiles:null
};

const ICON_PATHS = {
  'p-overview':'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',
  'p-chat':'M21 11a8 8 0 0 1-8 8H7l-5 3 2-6a8 8 0 1 1 17-5z',
  'p-orch':'M12 3v6 M5 15v-4h14v4 M3 16h4v5H3z M10 2h4v4h-4z M17 16h4v5h-4z',
  'p-docs':'M6 3h8l4 4v14H6z M14 3v5h4 M9 12h6 M9 16h6',
  'p-notes':'M4 3h16v18H4z M8 8h8 M8 12h8 M8 16h5',
  'p-prompts':'M8 5 2 12l6 7 M16 5l6 7-6 7 M14 3l-4 18',
  's-agents':'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M18 8a3 3 0 0 1 0 6 M22 21v-2a4 4 0 0 0-3-4',
  's-providers':'M8 2v5 M16 2v5 M5 7h14v3a7 7 0 0 1-14 0z M12 17v5',
  's-tools':'m14 6 4 4 M20 3a6 6 0 0 0-8 8L3 20l1 1 9-9a6 6 0 0 0 8-8l-4 4-2-2z',
  's-resources':'M3 7c0-5 18-5 18 0s-18 5-18 0 M3 7v10c0 5 18 5 18 0V7 M3 12c0 5 18 5 18 0',
  's-server':'M3 3h18v7H3z M3 14h18v7H3z M7 6h1 M7 17h1'
};
function icon(key) { return `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON_PATHS[key] || ICON_PATHS['p-overview']}"/></svg>`; }
let overviewStage = null;
function workspaceHero() {
  return `<div class="room-panel"><div class="room-heading"><div><span class="eyebrow">RUANG KERJA / 01</span><h3>Tim di studio</h3></div><button class="sec" data-go="p-orch">Buka orchestrator ↗</button></div><canvas id="overview-stage"></canvas><div class="room-inspector" id="overview-agent"><div><b>Pilih karakter</b><span> · lihat peran dan provider agent</span></div><span class="badge">READY</span></div><div class="room-caption"><span>Klik karakter untuk melihat detail agen.</span><span>Posisi diam = siap menerima tugas</span></div></div>`;
}
function mountOverviewStage() {
  if(overviewStage) overviewStage.destroy();
  const canvas = $('#overview-stage');
  overviewStage = canvas ? new AgentStage(canvas) : null;
  if(overviewStage) {
    overviewStage.setTeam(state.agents || []);
    overviewStage.onSelect = agent => {
      const panel = $('#overview-agent'); if (!panel || !agent) return;
      panel.classList.add('on');
      panel.innerHTML = `<div><b>${esc(agent.title)}</b><span> · ${esc(agent.name)} · ${esc(agent.provider || 'auto')}</span></div><span class="badge">${esc((agent.status || 'ready').toUpperCase())}</span>`;
    };
  }
}
function quickActions() {
  return `<div class="quick-grid">${[
    ['p-orch','Jalankan tim agen','Bagi tugas dan kolaborasikan keahlian agen.'],
    ['p-docs','Susun dokumentasi','Bangun PRD, brief, dan pengetahuan proyek.'],
    ['s-tools','Jelajahi tools','Uji kemampuan MCP langsung dari workspace.']
  ].map(([view,title,desc]) => `<button class="quick-card" data-go="${view}">${icon(view)}<b>${title} ↗</b><span>${desc}</span></button>`).join('')}</div>`;
}
function wireQuickActions(d) {
  d.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => switchView(b.dataset.go)));
}
document.querySelectorAll('nav button[data-v]').forEach(b => b.insertAdjacentHTML('afterbegin', icon(b.dataset.v)));

/* ---------- project helpers ---------- */
const LIST_VIEWS = new Set(['s-tools', 's-resources', 's-server', 'p-docs', 'p-prompts']);
const projObj = n => (state.projects || []).find(p => p.project === (n || state.active)) || null;
const scopedProjects = () => {
  const ps = state.projects || [];
  return state.active ? ps.filter(p => p.project === state.active) : ps;
};

function ctxStrip(extra) {
  if (!state.active) {
    const names = (state.projects || []).map(p => p.project);
    return `<div class="ctx"><span class="nm">Semua proyek</span>
      <span class="badge">${names.length} project</span>
      <span class="pth">${esc(names.join(', ') || 'belum ada project')}</span>
      <span class="sp"></span>${extra || ''}</div>`;
  }
  const p = projObj() || {};
  return `<div class="ctx"><span class="nm">${esc(p.project || state.active)}</span>
    ${p.active ? '<span class="badge ok">aktif</span>'
               : `<button class="sec" data-setactive="${esc(p.project)}">jadikan aktif</button>`}
    <span class="pth">${esc(p.path || '')}</span>
    <span class="sp"></span>${extra || ''}</div>`;
}

function wireCtx(d) {
  d.querySelectorAll('[data-setactive]').forEach(b =>
    b.addEventListener('click', () => selectProject(b.dataset.setactive)));
}

function toolOut(r) {
  if (r?.isError) throw new Error(r.text || 'Tool gagal dijalankan');
  const s = (r && r.structuredContent !== undefined) ? r.structuredContent : r;
  if (s && s.code && s.message) throw new Error(s.message);
  if (s && s.error) throw new Error(typeof s.error === 'string' ? s.error : JSON.stringify(s.error));
  return s || {};
}

async function selectProject(name) {
  state.active = name || "";
  state.sel = null;
  try { await api('/projects/select', name ? { project: name } : {}); } catch (e) { /* opsional */ }
  renderProjectBar();
  if (!document.querySelector('#pane-list').classList.contains('hidden')) renderList();
  renderDetail();
}

function renderProjectBar() {
  const sel = document.querySelector('#proj-switch');
  if (!sel) return;
  const ps = state.projects || [];
  let h = `<option value="">— Semua proyek (${ps.length}) —</option>`;
  ps.forEach(p => {
    h += `<option value="${esc(p.project)}" ${state.active === p.project ? 'selected' : ''}>`
       + `${esc(p.project)}${p.active ? '  ★' : ''}</option>`;
  });
  sel.innerHTML = h;
}

function openNewProject() {
  const overlay = document.createElement('div');
  overlay.className = 'modal';
  overlay.innerHTML = `
    <div class="box" style="width:min(470px,94vw);height:auto">
      <div class="mh"><span class="p">PROYEK BARU</span></div>
      <div class="mf">
        <div class="fg"><label>Nama</label><input class="ipt" id="np-name" placeholder="mis. toko-kopi"></div>
        <div class="fg"><label>Stack</label>
          <select id="np-stack">
            <option value="">dasar (docs + prompt)</option>
            <option value="laravel">laravel</option>
            <option value="node">node</option>
            <option value="python">python</option>
          </select></div>
        <div class="fg"><label>Lokasi</label><input class="ipt" id="np-path" placeholder="(opsional) path absolut"></div>
        <div class="hint">Dibuat: folder + <b>docs/PRD.md</b> + <b>docs/BRD.md</b> + 5 prompt + scaffold stack. Langsung jadi project aktif.</div>
      </div>
      <div class="mfoot">
        <button class="sec" id="np-cancel">BATAL</button>
        <button class="exe" id="np-go">BUAT PROJECT</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  document.querySelector('#np-cancel').addEventListener('click', close);
  document.querySelector('#np-go').addEventListener('click', async () => {
    const name = document.querySelector('#np-name').value.trim();
    if (!name) { toast('Isi nama project dulu', true); return; }
    const btn = document.querySelector('#np-go');
    const originalLabel = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>MEMBUAT';
    try {
      const s = toolOut(await api('/projects/create', {
        name, stack: document.querySelector('#np-stack').value || undefined,
        path: document.querySelector('#np-path').value.trim() || undefined,
      }));
      close();
      await loadProjects(); await loadProjectData();
      state.active = s.project; state.sel = null;
      renderProjectBar(); updateNavCounts();
      if (!document.querySelector('#pane-list').classList.contains('hidden')) renderList();
      renderDetail();
      toast('Project dibuat: ' + s.project + (s.stack ? ' [' + s.stack + ']' : ''));
    } catch (e) {
      btn.disabled = false; btn.textContent = 'BUAT PROJECT';
      toast('Gagal: ' + e.message, true);
    }
  });
  document.querySelector('#np-name').focus();
}


function toast(msg, isErr) {
  let box = document.querySelector('.toast');
  if (!box) { box = document.createElement('div'); box.className = 'toast'; box.setAttribute('role', 'status'); box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
  const t = document.createElement('div'); t.className = 't' + (isErr ? ' err' : ''); t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, 2600);
}

async function api(p, body) {
  const o = body ? {method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify(body)} : {};
  const r = await fetch('/api' + p, o);
  const data = await r.json();
  if (!r.ok || data.isError || data.error || (data.code && data.message)) {
    throw new Error(data.text || data.message || (typeof data.error === 'string' ? data.error : data.error?.message) || `HTTP ${r.status}`);
  }
  return data;
}

/* ---------- JSON syntax highlight (tiny, safe) ---------- */
function hljson(obj) {
  let raw = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
  if (raw.length > 100000) raw = raw.slice(0, 100000) + '\n... [dipotong ' + (raw.length - 100000) + ' karakter]';
  raw = esc(raw);
  return raw
    .replace(/&quot;(.+?)&quot;(\s*:)/g, '<span class="k">"$1"</span>$2')
    .replace(/:\s*&quot;((?:[^"\\]|\\.|[^&])*)&quot;/g, ': <span class="s">"$1"</span>')
    .replace(/:\s*(-?\d+\.?\d*(e[+-]?\d+)?)/gi, ': <span class="num">$1</span>')
    .replace(/:\s*(true|false|null)/g, ': <span class="bool">$1</span>');
}

/* ---------- server header status ---------- */
async function loadServer() {
  try {
    const s = await api('/server');
    $('#st-conn').className = 'stat on';
    $('#st-conn').innerHTML = '<b>online</b>';
    $('#st-proto').innerHTML = '<b>proto ' + esc(s.protocolVersion || '?') + '</b>';
    state.server = s;
  } catch (e) {
    $('#st-conn').className = 'stat err';
    $('#st-conn').innerHTML = '<b>offline</b>';
  }
}

/* ---------- nav / panes ---------- */
document.querySelectorAll('nav button').forEach(b =>
  b.addEventListener('click', () => switchView(b.dataset.v, b)));

function switchView(v, btn) {
  document.querySelectorAll('nav button').forEach(x => {
    const active = x.dataset.v === v; x.classList.toggle('active', active);
    if (active) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current');
  });
  if(overviewStage) { overviewStage.destroy(); overviewStage = null; }
  state.view = v;
  $('#pane-detail').scrollTop = 0;
  state.sel = null;
  if (v !== 'p-orch' && stage) { stage.destroy(); stage = null; }
  if (v !== 'p-chat' && chatStage) { chatStage.destroy(); chatStage = null; }
  const useList = LIST_VIEWS.has(v);
  $('#pane-list').classList.toggle('hidden', !useList);
  if (useList) renderList();
  renderDetail();
}

/* ---------- list column ---------- */
function renderList() {
  const list = $('#pane-list');
  const v = state.view;
  if (v === 's-server') {
    list.innerHTML = '<div class="list-h">SERVER<div class="cnt">raw</div></div>' +
      `<div class="item active"><span class="idx">01</span><span class="nm">initialize info</span></div>`;
    return;
  }
  if (v === 'p-docs' || v === 'p-prompts') { renderGroupedList(list, buildListModel()); return; }
  const items = v === 's-tools' ? state.tools : (v === 's-resources' ? state.resources : []);
  const label = v === 's-tools' ? 'TOOLS' : 'RESOURCES';
  let h = `<div class="list-h">${label}<div class="cnt">${items.length} items</div></div>`;
  h += `<div class="list-search"><input class="ipt" id="list-q" placeholder="cari..." value="${esc(state.filter[v] || '')}"></div>`;
  items.forEach((it, i) => {
    const key = v === 's-tools' ? it.name : it.uri;
    const desc = v === 's-tools' ? (it.title || '') : (it.description || '');
    h += `<div class="item ${state.sel === i ? 'active' : ''}" data-i="${i}" data-key="${esc((key + ' ' + desc).toLowerCase())}">
      <span class="idx">${String(i+1).padStart(2,'0')}</span>
      <span class="nm">${esc(key)}</span>
      <span class="ds">${esc(desc)}</span></div>`;
  });
  list.innerHTML = h;
  const qi = $('#list-q');
  const applyFilter = () => {
    const q = (state.filter[v] || '').toLowerCase();
    let n = 0;
    list.querySelectorAll('.item').forEach(el => {
      const show = !q || el.dataset.key.includes(q);
      el.style.display = show ? '' : 'none';
      if (show) n++;
    });
    const cnt = list.querySelector('.list-h .cnt');
    if (cnt) cnt.textContent = n + '/' + items.length;
  };
  if (qi) qi.addEventListener('input', e => { state.filter[v] = e.target.value; applyFilter(); });
  applyFilter();
  list.querySelectorAll('.item').forEach(el =>
    el.addEventListener('click', () => {
      state.sel = +el.dataset.i;
      renderList(); renderDetail();
    }));
}

/* item list proyek (docs & prompts), selalu dikelompokkan per project */
function buildListModel() {
  const v = state.view, out = [];
  if (v === 'p-docs') {
    out.push({ kind: 'action', action: 'new-doc', label: '+ Dokumen baru (generate PRD / BRD)',
               key: 'new doc dokumen baru prd brd' });
  }
  if (v === 'p-prompts' && !state.active) {
    const globals = (state.prompts || []).filter(x => x.name.indexOf('/') === -1);
    if (globals.length) {
      out.push({ kind: 'group', label: 'BAWAAN (GLOBAL)', sub: 'tidak terikat project' });
      globals.forEach(x => out.push({ kind: 'prompt', project: '', name: x.name, label: x.name,
        desc: x.description || '', key: x.name.toLowerCase() }));
    }
  }
  scopedProjects().forEach(p => {
    if (!state.active) out.push({ kind: 'group', label: p.project, sub: p.path || '' });
    if (v === 'p-docs') {
      const files = state.docs[p.project] || [];
      if (!files.length) out.push({ kind: 'hint', label: 'belum ada dokumen' });
      files.forEach(f => out.push({ kind: 'doc', project: p.project, file: f, label: f,
        key: (p.project + '/' + f).toLowerCase() }));
    } else {
      const prs = (state.prompts || []).filter(x => x.name.indexOf(p.project + '/') === 0);
      if (!prs.length) out.push({ kind: 'hint', label: 'belum ada prompt' });
      prs.forEach(x => out.push({ kind: 'prompt', project: p.project, name: x.name,
        label: x.name.split('/').slice(1).join('/'), desc: x.description || '',
        key: x.name.toLowerCase() }));
    }
  });
  return out;
}

function renderGroupedList(list, model) {
  state._lm = model;
  const v = state.view;
  const label = v === 'p-docs' ? 'DOCS' : 'PROMPTS';
  const real = model.filter(x => x.kind === 'doc' || x.kind === 'prompt').length;
  let h = `<div class="list-h">${label}<div class="cnt">${real} items</div></div>`;
  h += `<div class="list-search"><input class="ipt" id="list-q" placeholder="cari..." value="${esc(state.filter[v] || '')}"></div>`;
  model.forEach((m, i) => {
    if (m.kind === 'group') {
      h += `<div class="pgroup">${esc(m.label)}<span class="sub">${esc(m.sub || '')}</span></div>`;
    } else if (m.kind === 'hint') {

/* ---------- filesystem browser ---------- */
function fsJoin(base, name) {
  if (!base) return name;
  const sep = base.includes('\\') ? '\\' : '/';
  return base.replace(/[\\/]+$/, '') + sep + name;
}
function openFsBrowser(input, mode) {
  mode = mode || 'any';
  const overlay = document.createElement('div');
  overlay.className = 'modal';
  overlay.innerHTML = `<div class="box">
    <div class="mh">
      <button class="sec" id="fs-up">naik ..</button>
      <div class="p" id="fs-path">memuat...</div>
      <input class="ipt" id="fs-input" style="max-width:220px" placeholder="ketik path + Enter">
    </div>
    <div class="ml" id="fs-list"></div>
    <div class="mfoot">
      <span class="crumb" id="fs-info"></span>
      <button class="sec" id="fs-cancel">Batal</button>
      <button class="exe" id="fs-pick">Gunakan folder ini</button>
    </div></div>`;
  document.body.appendChild(overlay);
  let cur = '', up = null;
  const close = () => overlay.remove();
  async function load(p) {
    const r = await fetch('/api/fs?path=' + encodeURIComponent(p || ''));
    const d = await r.json();
    cur = d.path || '';
    up = d.parent || null;
    $('#fs-path').textContent = d.path || '(pilih drive)';
    $('#fs-input').value = d.path || '';
    $('#fs-up').disabled = !up;
    const list = $('#fs-list');
    let html = '';
    (d.dirs || []).forEach(nm =>
      html += `<div class="me dir" data-dir="${esc(nm)}"><span class="ic">▸</span>${esc(nm)}</div>`);
    if (mode === 'any')
      (d.files || []).forEach(nm =>
        html += `<div class="me file" data-file="${esc(nm)}"><span class="ic">·</span>${esc(nm)}</div>`);
    list.innerHTML = html || '<div class="crumb">(kosong / tidak ada akses)</div>';
    list.querySelectorAll('[data-dir]').forEach(el =>
      el.addEventListener('click', () => load(fsJoin(cur, el.dataset.dir))));
    list.querySelectorAll('[data-file]').forEach(el =>
      el.addEventListener('click', () => { if (input) input.value = fsJoin(cur, el.dataset.file); close(); }));
    $('#fs-info').textContent = `${(d.dirs || []).length} folder, ${(d.files || []).length} file`;
  }
  $('#fs-up').addEventListener('click', () => { if (up) load(up); });
  $('#fs-input').addEventListener('keydown', e => { if (e.key === 'Enter') load(e.target.value); });
  $('#fs-cancel').addEventListener('click', close);
  $('#fs-pick').addEventListener('click', () => { if (input) input.value = ($('#fs-input').value || cur); close(); });
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  load(input && input.value.trim() ? input.value.trim() : '');
}

function collectArgs(container) {
  const args = {};
  container.querySelectorAll('input[data-k]').forEach(inp => {
    if (!inp.reportValidity()) throw new Error('Lengkapi kolom ' + inp.dataset.k);
    if (inp.value.trim() === '') return;
    const type = inp.dataset.type || 'string';
    let value = inp.value;
    if (type !== 'string') {
      try { value = JSON.parse(value); } catch { throw new Error(inp.dataset.k + ': masukkan ' + type + ' yang valid'); }
      const valid = type === 'integer' ? Number.isInteger(value) : type === 'array' ? Array.isArray(value)
        : type === 'object' ? value !== null && typeof value === 'object' && !Array.isArray(value)
        : typeof value === type;
      if (!valid) throw new Error(inp.dataset.k + ': harus berupa ' + type);
    }
    args[inp.dataset.k] = value;
  });
  return args;
}

async function exec(label, path, body, resEl, btn) {
  const originalLabel = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>' + label;
  const t0 = performance.now();
  try {
    const out = await api(path, body);
    const ms = Math.round(performance.now() - t0);
    const err = out.isError || out.error || out.code;
    state.hist.unshift({label, ms, err: !!err});
    state.hist = state.hist.slice(0, 12);
    showConsole(resEl, err ? {error: out} : (out.structuredContent ?? out.text ?? out), err, ms);
  } catch (e) {
    state.hist.unshift({label, ms: Math.round(performance.now() - t0), err: true});
    showConsole(resEl, {error: e.message}, true, Math.round(performance.now() - t0));
  } finally {
    btn.disabled = false; btn.innerHTML = originalLabel;
  }
}

function showConsole(resEl, data, isErr, ms) {
  const old = document.querySelector('.console'); if (old) old.remove();
  const div = document.createElement('div');
  div.className = 'console';
  div.innerHTML = `<div class="console-h">
      <span class="${isErr ? 'tag-err' : 'tag-ok'}">${isErr ? 'ERR' : 'OK'}</span>
      <span>RESPONSE</span><span class="lat">${ms} ms</span></div>
    <pre>${hljson(data)}</pre>
    <div class="hist">${state.hist.map(h =>
      `<span class="${h.err ? 'err' : ''}"><b>${esc(h.label)}</b> ${h.ms}ms${h.err ? ' err' : ''}</span>`).join('')}</div>`;
  const detail = $('#pane-detail');
  detail.appendChild(div);
  div.scrollIntoView({behavior:'smooth'});
}

/* ---------- 2D agent stage (canvas) ---------- */
class AgentStage {
  constructor(canvas) {
    this.cv = canvas; this.ctx = canvas.getContext('2d');
    this.dpr = window.devicePixelRatio || 1;
    this.agents = []; this.byName = {}; this.activeName = null;
    this.now = 0; this._lr = null; this.scene = 'office';
    this.GW = 9; this.GH = 7;
    this.deskSpots = [[1.5,1.1],[3.6,1.1],[5.7,1.1],[7.7,1.1],[1.2,3.5],[1.2,5.5],[7.6,3.8],[7.6,5.7]];
    this.entry = { gx: 0.4, gy: 2.6 };
    this.meeting = { gx: 4.7, gy: 4.6 };
    this.queue = []; this.processing = false; this.onTurn = null; this.onDone = null;
    this._dead = false;
    this.reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.selected = null; this.hitAreas = []; this.onSelect = null;
    this._hitAt = e => {
      const r = this.cv.getBoundingClientRect();
      const x = (e.clientX-r.left-this.offsetX)/this.scale, y = (e.clientY-r.top-this.offsetY)/this.scale;
      return [...this.hitAreas].reverse().find(a => Math.hypot(a.x-x, a.y-28-y)<30);
    };
    this._onPointer = e => {
      const hit = this._hitAt(e);
      this.selected = hit ? hit.agent.name : null;
      this.cv.style.cursor = hit ? 'pointer' : 'default';
    };
    this._onClick = e => {
      const hit = this._hitAt(e);
      if (!hit) return;
      this.selected = hit.agent.name;
      if (this.onSelect) this.onSelect(hit.agent);
    };
    this.cv.addEventListener('pointermove', this._onPointer);
    this.cv.addEventListener('click', this._onClick);
    this.cv.setAttribute('role','img');
    this.cv.setAttribute('aria-label','Kantor isometrik tim agen. Posisi dan penanda menampilkan aktivitas agen.');
    this._onResize = () => this.resize();
    window.addEventListener('resize', this._onResize);
    this.resize();
    this.start();
  }
  destroy() { this._dead = true; this.agents.forEach(a => { if(a.onArrive) { a.onArrive(); a.onArrive=null; } }); this.cv.removeEventListener('pointermove',this._onPointer); this.cv.removeEventListener('click',this._onClick); window.removeEventListener('resize', this._onResize); this.stop(); }
  stop() { if (this._lr) cancelAnimationFrame(this._lr); this._lr = null; }
  start() {
    if (this._lr) return;
    const tick = (now) => {
      if (this._dead) return;
      this.delta = Math.min((now-(this.lastFrame || now))/1000, .05); this.lastFrame=now;
      this.now = now; this.step(); this.draw(); this._lr = requestAnimationFrame(tick);
    };
    this._lr = requestAnimationFrame(tick);
  }
  resize() {
    const r = this.cv.getBoundingClientRect();
    this.w = r.width || 760; this.h = r.height || 420;
    this.cv.width = this.w * this.dpr; this.cv.height = this.h * this.dpr;
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.layout();
  }
  layout() {
    this.tileW = 76; this.tileH = 38; this.wallH = 102;
    this.originX = 438; this.originY = 142;
    this.scale = Math.min(this.w / 940, this.h / 590);
    this.offsetX = (this.w - 940 * this.scale) / 2;
    this.offsetY = (this.h - 590 * this.scale) / 2;
  }
  iso(gx, gy) { return {x:this.originX+(gx-gy)*38, y:this.originY+(gx+gy)*19}; }
  _mk(name, title, provider, i) {
    const home = this.deskSpots[i % this.deskSpots.length];
    return {
      name, title: title || name, provider: provider || '', col: agentColor(name), slot: i,
      home: { gx: home[0], gy: home[1] + 0.55 },
      gx: home[0], gy: home[1] + 0.55,
      tgx: home[0], tgy: home[1] + 0.55,
      onArrive: null, talking: false, walkT: 0, status: 'ready', detail: 'siap menerima tugas',
    };
  }
  setTeam(agents) {
    const prev = this.byName;
    this.agents = (agents || []).map((a, i) => {
      const old = prev[a.name];
      const na = this._mk(a.name, a.title, a.provider, i);
      if (old) { na.gx = old.gx; na.gy = old.gy; na.status = old.status; na.detail = old.detail; }
      return na;
    });
    this.byName = {}; this.agents.forEach(a => this.byName[a.name] = a);
    this.activeName = null;
  }
  ensureAgent(name, title, provider) {
    if (this.byName[name]) return this.byName[name];
    const a = this._mk(name, title, provider, this.agents.length);
    this.agents.push(a); this.byName[name] = a; return a;
  }
  setAgentState(name, status, detail) {
    const a = this.byName[name]; if (!a) return;
    a.status = status || 'ready'; a.detail = detail || a.detail;
    if (this.selected === name && this.onSelect) this.onSelect(a);
  }
  step() {
    const speed = this.reducedMotion ? 100 : (this.delta || 1/60) * 2.4;
    for (const a of this.agents) {
      const dx = a.tgx - a.gx, dy = a.tgy - a.gy, d = Math.hypot(dx, dy);
      if (d > 0.02) {
        const s = Math.min(speed, d);
        a.gx += dx / d * s; a.gy += dy / d * s; a.walkT += s * 34;
      } else {
        a.gx = a.tgx; a.gy = a.tgy;
        if (a.onArrive) { const cb = a.onArrive; a.onArrive = null; cb(); }
      }
    }
  }
  walkTo(a, spot) { if(this._dead) return Promise.resolve(); return new Promise(res => { if(a.onArrive) a.onArrive(); a.tgx = spot.gx; a.tgy = spot.gy; a.onArrive = res; }); }
  sleep(ms) { return new Promise(res => setTimeout(res, this._dead ? 0 : ms)); }
  setScene(kind) { this.scene = kind || 'office'; }
  roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  box(c, cx, cy, w, d, H, top, left, right) {
    const hw = w / 2, hd = d / 2;
    c.fillStyle = left;
    c.beginPath(); c.moveTo(cx - hw, cy - H); c.lineTo(cx, cy - H + hd); c.lineTo(cx, cy + hd); c.lineTo(cx - hw, cy); c.closePath(); c.fill();
    c.fillStyle = right;
    c.beginPath(); c.moveTo(cx + hw, cy - H); c.lineTo(cx, cy - H + hd); c.lineTo(cx, cy + hd); c.lineTo(cx + hw, cy); c.closePath(); c.fill();
    c.fillStyle = top;
    c.beginPath(); c.moveTo(cx, cy - H - hd); c.lineTo(cx + hw, cy - H); c.lineTo(cx, cy - H + hd); c.lineTo(cx - hw, cy - H); c.closePath(); c.fill();
  }
  wallRect(c, gx1, gy1, gx2, gy2, hgt, color, alpha) {
    const a = this.iso(gx1, gy1), b = this.iso(gx2, gy2);
    c.fillStyle = color; c.globalAlpha = alpha == null ? 1 : alpha;
    c.beginPath();
    c.moveTo(a.x, a.y - hgt); c.lineTo(b.x, b.y - hgt);
    c.lineTo(b.x, b.y); c.lineTo(a.x, a.y); c.closePath(); c.fill();

  resetQueue() { this.queue = []; this.processing = false; this.activeName = null; }

  }
  async _speak(turn) {

  play(transcript, onTurn, done) {
    this.resetQueue();

    if (activeRun) { activeRun.cancel(); syncStageRun(); }
    stopTimer();
    const e = elapsedEl(); if (e) e.textContent = '';
    cap().textContent = 'dihentikan';
    toast('Dijalankan berhenti', true);
  });
  const out = () => $('#o-out');
  function turnHTML(x, i) {
    const signals = OrchestrationRun.signals(x.content);
    const chips = [
      ...signals.paths.map(path => `<span class="turn-signal" title="${esc(path)}">file · ${esc(path.split(/[\\/]/).pop())}</span>`),
      ...(signals.tests ? [`<span class="turn-signal ${signals.testState==='fail'?'bad':signals.testState==='pass'?'good':''}">test · ${esc(signals.testState)}</span>`] : []),
      ...(signals.diff ? ['<span class="turn-signal">diff</span>'] : []),
    ].join('');
    const long = String(x.content || '').length > 520;
    return `<div class="turn ${esc(x.agent)}" id="turn-${i}">
      <div class="th"><b>${esc(x.title || x.agent)}</b><span class="badge">${esc(x.agent)}</span><span class="prov">${esc(x.provider || '')}</span></div>
      <div class="tc${long?' long':''}">${esc(x.content)}</div><div class="turn-tools">${chips || '<span class="turn-signal">output</span>'}${long?'<button data-expand>LIHAT LENGKAP ↓</button>':''}</div></div>`;
  }
  out().addEventListener('click', event => {
    const button = event.target.closest('[data-expand]'); if (!button) return;
    const turn = button.closest('.turn'); turn.classList.toggle('expanded');
    button.textContent = turn.classList.contains('expanded') ? 'RINGKAS ↑' : 'LIHAT LENGKAP ↓';
  });
  function wireReveal(turns) {
    let reveal = 0;
    stage.onTurn = (turn) => {
      const el = document.getElementById('turn-' + reveal);
      if (el) { el.classList.add('live'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
      reveal++;
      cap().textContent = reveal + '/' + turns.length + ' · ' + turn.agent;
    };
  }
  async function waitDrain() {
    while (stage && !stage._dead && (stage.processing || stage.queue.length)) {
      await new Promise(r => setTimeout(r, 120));
    }
  }
  async function run() {
    const team = selectedTeam();
    const task = $('#o-task').value.trim();
    if (!task) { toast('Isi tugas dulu', true); return; }
    if (!team.length) { toast('Pilih minimal 1 agen', true); return; }
    activeRun = new OrchestrationRun(team, agents, task);
    activeRun.startFirst(); selectedAgent = team[0];
    stage.setTeam(agents.filter(a => team.includes(a.name)));
    syncStageRun(); inspectAgent(selectedAgent);
    if ($('#o-exec').value === 'approval') {
      runBtn.disabled = true; runBtn.innerHTML = '<span class="spinner"></span>RUNNING';
      repBtn.disabled = true; out().innerHTML = ''; cap().textContent = 'menunggu...';
      startTimer(); stopBtn.disabled = false;
      stage.resetQueue();
      await runApproval(team, task, state.active || undefined);
      approvalCancel = null;
      stopTimer(); stopBtn.disabled = true;
      const e0 = elapsedEl(); if (e0) e0.textContent = '';
      runBtn.disabled = false; runBtn.textContent = 'RUN TEAM';
      return;
    }
    runBtn.disabled = true; runBtn.innerHTML = '<span class="spinner"></span>RUNNING';
    repBtn.disabled = true; out().innerHTML = ''; cap().textContent = 'menghubungi...';
    startTimer(); stopBtn.disabled = false;
    stage.resetQueue();
    const body = { task, project: state.active || undefined, team: team.join(','), mode: $('#o-mode').value, rounds: +$('#o-rounds').value };
    if (!state.providers.length) body.simulate = true;
    orchAbort = new AbortController();
    const tr = []; let simulated = false, errored = null, reveal = 0;
    stage.onTurn = (turn) => {
      const el = document.getElementById('turn-' + reveal);
      if (el) { el.classList.add('live'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
      reveal++;
      cap().textContent = reveal + '/' + team.length + ' · ' + turn.agent;
    };
    try {
      const resp = await fetch('/api/orchestrate/stream', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        signal: orchAbort.signal,
      });
      if (!resp.body) throw new Error('browser tidak dukung streaming');
      const reader = resp.body.getReader(), dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
          if (!line) continue;
          let ev; try { ev = JSON.parse(line); } catch { continue; }
          if (ev.type === 'status' && ev.phase === 'start') {
            activeRun.set(ev.agent, 'running', 'sedang mengerjakan tugas', {provider: ev.provider || 'auto'});
            syncStageRun(); inspectAgent(ev.agent);
            cap().textContent = (ev.title || ev.agent) + ' sedang bekerja...';
          } else if (ev.type === 'turn') {
            tr.push(ev);
            activeRun.complete(ev.agent, ev.content, ev.provider);
            syncStageRun();
            out().insertAdjacentHTML('beforeend', turnHTML(ev, tr.length - 1));
            cap().textContent = 'menunggu ' + ev.agent + '... (' + tr.length + '/' + team.length + ')';
            stage.push(ev);
          } else if (ev.type === 'done') { simulated = ev.simulated; }
          else if (ev.type === 'error') { errored = ev.message; }
        }
      }
      await waitDrain();
      if (errored) {
        activeRun.fail(errored); syncStageRun();
        out().insertAdjacentHTML('beforeend', '<div class="turn live"><div class="tc">ERROR: ' + esc(errored) + '</div></div>');
        cap().textContent = 'error';
      } else {
        activeRun.finish(); syncStageRun();
        lastTurns = tr; lastTranscript = tr;
        cap().textContent = 'selesai · ' + tr.length + ' turn' + (simulated ? ' · SIMULASI' : '');
        repBtn.disabled = false;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') {
        if (activeRun && !activeRun.finishedAt) { activeRun.cancel(); syncStageRun(); }
        out().insertAdjacentHTML('beforeend', '<div class="turn live"><div class="tc">dijalankan berhenti oleh pengguna.</div></div>');
        cap().textContent = 'dihentikan';
      } else {
        if (activeRun) { activeRun.fail(e.message); syncStageRun(); }
        out().insertAdjacentHTML('beforeend', '<div class="turn live"><div class="tc">error: ' + esc(e.message) + '</div></div>');
        cap().textContent = 'error';
      }
    } finally {
      stopTimer(); stopBtn.disabled = true; orchAbort = null;
      const e1 = elapsedEl(); if (e1) e1.textContent = '';
      runBtn.disabled = false; runBtn.textContent = 'RUN TEAM';
    }
  }
  async function runApproval(team, task, project) {
    const steps = team.map(a => ({ agent: a, instruction: task }));
    const collected = [];
    let ctx = '', i = 0;
    const out = $('#o-out');
    out.innerHTML = '';
    return new Promise(resolveFlow => {
    let stopped = false, settled = false;
    const settle = () => { if (!settled) { settled = true; approvalCancel = null; resolveFlow(); } };
    approvalCancel = () => {
      stopped = true;
      const confirm = document.getElementById('o-confirm'); if (confirm) confirm.remove();
      if (stage) { stage.activeName = null; Object.values(stage.byName).forEach(a => { a.talking = false; }); }
      activeRun.cancel(); syncStageRun();
      cap().textContent = 'dihentikan'; repBtn.disabled = false;
      settle();
    };
    const step = async () => {
      if (stopped) return;
      if (i >= steps.length) {
        activeRun.finish(); syncStageRun();
        cap().textContent = 'selesai · ' + steps.length + ' turn';
        repBtn.disabled = false; lastTurns = collected; lastTranscript = collected;
        toast('Workflow selesai');
        settle();
        return;
      }
      const st = steps[i];
      const ag = agents.find(a => a.name === st.agent) || { name: st.agent, title: st.agent, provider: '' };
      activeRun.set(st.agent, 'running', 'menjalankan tahap approval'); syncStageRun(); inspectAgent(st.agent);
      cap().textContent = (ag.title || st.agent) + ' mengerjakan...';
      if (stage) {
        const a = stage.ensureAgent(ag.name, ag.title, ag.provider);
        stage.activeName = ag.name;
        await stage.walkTo(a, stage.meeting);
        if (stopped) return;
        if (stage && !stage._dead) a.talking = true;
      }
      let s = {};
      try {
        const r = await api('/agents/run', { agent: st.agent, task: st.instruction, project, context: ctx || undefined });
        s = r.structuredContent || r;
        if (s.error) throw new Error(JSON.stringify(s.error));
      } catch (e) { s = { content: 'Error: ' + e.message, provider: 'error' }; }
      if (stopped) return;
      if (stage && stage.byName[ag.name]) {
        const a = stage.byName[ag.name]; a.talking = false; stage.activeName = null; stage.walkTo(a, a.home);
      }
      const turn = { agent: st.agent, title: ag.title, provider: s.provider || '', content: s.content || '' };
      if (s.provider === 'error') activeRun.set(st.agent, 'error', s.content || 'proses gagal');
      else activeRun.complete(st.agent, turn.content, turn.provider);
      syncStageRun();
      collected.push(turn);
      out.insertAdjacentHTML('beforeend', turnHTML(turn, i));
      const el = document.getElementById('turn-' + i);
      if (el) { el.classList.add('live'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
      ctx += '\n\n[' + st.agent + ']\n' + (s.content || '');
      i++;
      if (i < steps.length) {
        const nextName = (agents.find(a => a.name === steps[i].agent) || {}).title || steps[i].agent;
        out.insertAdjacentHTML('beforeend', `<div class="turn architect" id="o-confirm"><div class="th"><b>MENUNGGU KONFIRMASI</b><span class="prov">berikutnya: ${esc(nextName)}</span></div>
          <div class="tc"><div class="hint" style="margin-bottom:6px">Tulis catatan/keputusan lalu LANJUT.</div>
          <div class="row" style="gap:8px"><input class="ipt" id="oc-in" placeholder="catatan, atau 'lanjut'"><button class="exe" id="oc-go">LANJUT</button><button class="sec" id="oc-stop">STOP</button></div></div></div>`);
        out.scrollTop = out.scrollHeight;
        $('#oc-go').addEventListener('click', () => {
          const v = $('#oc-in').value.trim() || 'lanjut';
          ctx += '\n\nCatatan user: ' + v;
          const c = document.getElementById('o-confirm'); if (c) c.remove();
          step();
        });
        $('#oc-stop').addEventListener('click', () => {
          approvalCancel();
        });
      } else {
        activeRun.finish(); syncStageRun();
        cap().textContent = 'selesai · ' + steps.length + ' turn';
        repBtn.disabled = false; lastTurns = collected; lastTranscript = collected;
        toast('Workflow selesai');
        settle();
      }
    };
    step();
    });
  }
  runBtn.addEventListener('click', run);
  repBtn.addEventListener('click', async () => {
    if (!lastTurns.length) return;
    repBtn.disabled = true; cap().textContent = 'replay...';
    out().innerHTML = lastTurns.map((x, i) => turnHTML(x, i)).join('');
    stage.resetQueue(); wireReveal(lastTurns);
    lastTurns.forEach(t => stage.push(t));
    await waitDrain();
    cap().textContent = 'selesai'; repBtn.disabled = false;
  });
}

/* ---------- chat ---------- */
function mdLite(t) {
  const inline = value => {
    const codes = [];
    let text = esc(value).replace(/`([^`]+)`/g, (_, code) => { codes.push(code); return '\u0000C' + (codes.length-1) + '\u0000'; });
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return text.replace(/\u0000C(\d+)\u0000/g, (_, i) => '<code>' + codes[+i] + '</code>');
  };
  const lines = String(t || '').replace(/\r\n/g, '\n').split('\n'), out = [];
  const cells = line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(x => x.trim());
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const code = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      if (i < lines.length) i++;
      out.push('<pre class="code"><code>' + esc(code.join('\n')) + '</code></pre>'); continue;
    }
    if (!line.trim()) { i++; continue; }
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) { const n = heading[1].length; out.push(`<h${n}>${inline(heading[2])}</h${n}>`); i++; continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (line.includes('|') && i+1 < lines.length && cells(lines[i+1]).every(x => /^:?-{3,}:?$/.test(x))) {
      const headers = cells(line); i += 2;
      let table = '<div class="table-scroll"><table><thead><tr>' + headers.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) {
        table += '<tr>' + cells(lines[i++]).map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>';
      }
      out.push(table + '</tbody></table></div>'); continue;
    }
    const item = line.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
    if (item) {
      const tag = /\d/.test(item[1]) ? 'ol' : 'ul'; const items = [];
      while (i < lines.length) {
        const next = lines[i].match(/^\s*([-*]|\d+\.)\s+(.*)$/);
        if (!next || (/\d/.test(next[1]) ? 'ol' : 'ul') !== tag) break;
        items.push('<li>' + inline(next[2]) + '</li>'); i++;
      }
      out.push('<' + tag + '>' + items.join('') + '</' + tag + '>'); continue;
    }
    if (/^>\s?/.test(line)) { out.push('<blockquote>' + inline(line.replace(/^>\s?/, '')) + '</blockquote>'); i++; continue; }
    out.push('<p>' + inline(line) + '</p>'); i++;
  }
  return out.join('\n');
}

let chatStage = null;
function renderChat(d) {
  const agents = state.agents || [], provs = state.providers || [], pdefs = state.providerDefs || [];
  if (!state.chat) state.chat = { msgs: [], system: "", mode: "auto" };
  d.innerHTML = `
    <div class="chatwrap">
      <div class="dhead" style="padding:14px 22px 8px">
        <h2>Chat <span class="tag">LLM</span></h2>
        <div class="row" style="margin-top:8px;gap:10px;flex-wrap:wrap">
          <span class="badge ok">AUTO · model dipilih otomatis</span>
          <select id="ch-mode" style="max-width:180px">
            <option value="auto" ${state.chat.mode === 'auto' ? 'selected' : ''}>Mode: Otomatis</option>
            <option value="approval" ${state.chat.mode === 'approval' ? 'selected' : ''}>Mode: Approval</option>
          </select>
          <input class="ipt" id="ch-sys" placeholder="system prompt (opsional)" style="max-width:340px" value="${esc(state.chat.system)}">
          <button class="sec" id="ch-clear">bersihkan</button>
          <span class="badge ${provs.length ? 'ok' : 'warn'}">${provs.length ? ('live: ' + provs.join(', ')) : 'tak ada provider aktif'}</span>
        </div>
      </div>
      ${ctxStrip()}
      <details class="chat-room"><summary>Ruang kerja tim <span>lihat visual 2D</span></summary><div class="stage-wrap">
        <div class="cap"><span>STUDIO</span><span class="r" id="ch-stage-cap">idle</span></div>
        <canvas id="chat-stage"></canvas>
      </div></details>
      <div class="chat-log" id="ch-log"></div>
      <div class="chatbar">
        <textarea class="ipt" id="ch-in" placeholder="Tulis pesan... (Enter kirim, Shift+Enter baris baru)"></textarea>
        <button class="exe" id="ch-send">KIRIM</button>
      </div>
    </div>`;
  if (chatStage) { chatStage.destroy(); chatStage = null; }
  chatStage = new AgentStage($('#chat-stage'));
  chatStage.setTeam(agents);
  const roomToggle = d.querySelector('.chat-room');
  roomToggle.addEventListener('toggle', () => { if(roomToggle.open) chatStage.resize(); });
  wireCtx(d);

  const log = $('#ch-log');
  const renderMsgs = () => {
    log.innerHTML = state.chat.msgs.map(m => `
      <div class="msg ${m.role}">
        <div class="who">${m.role === 'user' ? 'KAMU' : esc(m.agent ? m.agent.toUpperCase() : 'AI')}</div>
        <div class="body">${m.role === 'assistant' ? mdLite(m.content) : esc(m.content)}</div>
        ${m.meta ? `<div class="meta">${esc(m.meta)}</div>` : ''}
      </div>`).join('') || '<div class="chat-welcome"><div class="welcome-mark">✳</div><h3>Apa yang ingin dikerjakan?</h3><p>Tulis tugas atau pertanyaan. Percakapan mengikuti proyek yang sedang dipilih.</p></div>';
    log.scrollTop = state.chat.msgs.length ? log.scrollHeight : 0;
  };
  renderMsgs();
  $('#ch-sys').addEventListener('input', e => { state.chat.system = e.target.value; });
  $('#ch-mode').addEventListener('change', e => { state.chat.mode = e.target.value; });
  $('#ch-clear').addEventListener('click', () => { state.chat.msgs = []; renderMsgs(); });

  const addWait = (m) => {
    log.insertAdjacentHTML('beforeend', `<div class="msg assistant" id="ch-wait"><div class="who">AI</div><div class="body"><span class="spinner"></span>${esc(m)}</div></div>`);
    log.scrollTop = log.scrollHeight;
  };
  const removeWait = () => { const w = document.getElementById('ch-wait'); if (w) w.remove(); };
  const removeConfirm = () => { const c = document.getElementById('ch-confirm'); if (c) c.remove(); };
  const showConfirm = (nextAgent) => {
    removeConfirm();
    log.insertAdjacentHTML('beforeend', `<div class="msg assistant" id="ch-confirm"><div class="who">MENUNGGU KONFIRMASI</div>
      <div class="body">
        <div class="hint" style="margin-bottom:6px">Tahap berikutnya: <b>${esc(nextAgent)}</b>. Tulis catatan/keputusan lalu kirim, atau ketik "lanjut".</div>
        <div class="row" style="gap:8px">
          <input class="ipt" id="cf-in" placeholder="mis. Nama: Kopi Senja; gaya: hangat; warna coklat">
          <button class="exe" id="cf-go">LANJUT</button>
          <button class="sec" id="cf-stop">STOP</button>
        </div>
      </div></div>`);
    log.scrollTop = log.scrollHeight;
    $('#cf-go').addEventListener('click', () => confirmContinue($('#cf-in').value.trim() || 'lanjut'));
    $('#cf-stop').addEventListener('click', () => {
      removeConfirm();
      if (state.chat.wf) { state.chat.wf = null; }
      state.chat.msgs.push({ role: 'assistant', content: 'Workflow dihentikan.', meta: 'stop' });
      renderMsgs();
    });
    const ci = $('#cf-in'); if (ci) ci.focus();
  };
  function confirmContinue(note) {
    if (!state.chat.wf) return;
    removeConfirm();
    state.chat.msgs.push({ role: 'user', content: note });
    renderMsgs();
    state.chat.wf.paused = false;
    state.chat.wf.ctx += '\n\nCatatan/keputusan user: ' + note;
    wfRun();
  }
  async function wfRun() {
    const w = state.chat.wf; if (!w) return;
    if (w.idx >= w.steps.length) {
      state.chat.wf = null;
      state.chat.msgs.push({ role: 'assistant', content: 'Workflow selesai. Semua tahap sudah dijalankan.', meta: 'workflow' });
      renderMsgs(); toast('Workflow selesai');
      return;
    }
    const st = w.steps[w.idx];
    const ag = agents.find(a => a.name === st.agent) || { name: st.agent, title: st.agent, provider: '' };
    addWait((ag.title || ag.name) + ' mengerjakan...');
    let walking = null;
    if (chatStage) {
      const a = chatStage.ensureAgent(ag.name, ag.title, ag.provider);
      chatStage.activeName = ag.name;
      $('#ch-stage-cap').textContent = (ag.title || ag.name) + ' mengerjakan...';
      walking = (async () => { await chatStage.walkTo(a, chatStage.meeting); if (chatStage && !chatStage._dead) a.talking = true; })();
    }
    const t0 = performance.now();
    try {
      const r = await api('/agents/run', { agent: st.agent, task: st.instruction, project: w.project, context: w.ctx || undefined });
      const s = r.structuredContent || r;
      const ms = Math.round(performance.now() - t0);
      if (s.error) throw new Error(JSON.stringify(s.error));
      state.chat.msgs.push({ role: 'assistant', agent: st.agent, content: s.content || '(kosong)', meta: `${ag.title} · ${s.provider || ''} · ${ms} ms` });
      w.ctx += '\n\n[' + st.agent + ']\n' + (s.content || '');
    } catch (e) {
      state.chat.msgs.push({ role: 'assistant', agent: st.agent, content: 'Error: ' + e.message, meta: 'gagal' });
    } finally {
      removeWait(); renderMsgs();
      if (walking) await Promise.race([walking.catch(() => {}), new Promise(r => setTimeout(r, 3000))]);
      if (chatStage && chatStage.byName[ag.name]) {
        const a = chatStage.byName[ag.name]; a.talking = false; chatStage.activeName = null; chatStage.walkTo(a, a.home);
      }
    }
    w.idx++;
    if (w.idx < w.steps.length) {
      if (w.mode === 'approval') {
        w.paused = true;
        const next = w.steps[w.idx];
        state.chat.msgs.push({ role: 'assistant', content: `Tahap ${w.idx}/${w.steps.length} selesai. Berikutnya: ${next.agent}. Balas untuk konfirmasi/catatan, atau ketik "lanjut".`, meta: 'menunggu konfirmasi' });
        renderMsgs();
        showConfirm(next.agent);
      } else {
        setTimeout(wfRun, 300);
      }
    } else {
      state.chat.wf = null;
      state.chat.msgs.push({ role: 'assistant', content: `Workflow selesai. ${w.steps.length} tahap dijalankan.`, meta: 'workflow' });
      renderMsgs(); toast('Workflow selesai');
    }
  }
  async function singleChat(text) {
    addWait('memilih model & berpikir...');
    let pick = null;
    try { const rr = await api('/route?message=' + encodeURIComponent(text)); pick = rr.structuredContent || rr; } catch (e) {}
    let walking = null;
    if (chatStage && pick && pick.agent) {
      const a = chatStage.ensureAgent(pick.agent, pick.title, pick.provider);
      chatStage.activeName = pick.agent;
      $('#ch-stage-cap').textContent = '→ ' + (pick.title || pick.agent) + ' (' + (pick.model || pick.provider) + ')';
      walking = (async () => { await chatStage.walkTo(a, chatStage.meeting); if (chatStage && !chatStage._dead) a.talking = true; })();
    }
    const t0 = performance.now();
    try {
      const r = await api('/chat', {
        prompt: text, agent: pick && pick.agent ? pick.agent : undefined,
        system: state.chat.system || undefined,
        messages: JSON.stringify(state.chat.msgs.slice(0, -1).map(m => ({ role: m.role, content: m.content }))),
      });
      const s = r.structuredContent || r;
      const ms = Math.round(performance.now() - t0);
      if (s.error || !s.content) throw new Error(s.error ? JSON.stringify(s.error) : 'jawaban kosong');
      state.chat.msgs.push({ role: 'assistant', agent: s.agent || '', content: s.content, meta: `${(s.title || s.agent || '')} · ${s.model || ''} · ${ms} ms` });
      if (chatStage) $('#ch-stage-cap').textContent = (s.title || s.agent || 'AI') + ' selesai';
    } catch (e) {
      state.chat.msgs.push({ role: 'assistant', content: 'Error: ' + e.message, meta: 'gagal' });
      if (chatStage) $('#ch-stage-cap').textContent = 'error';
    } finally {
      removeWait(); renderMsgs();
      if (walking) await Promise.race([walking.catch(() => {}), new Promise(r => setTimeout(r, 3000))]);
      const who = pick && pick.agent ? pick.agent : '';
      if (chatStage && who && chatStage.byName[who]) {
        const a = chatStage.byName[who]; a.talking = false; chatStage.activeName = null; chatStage.walkTo(a, a.home);
      }
    }
  }
  async function send() {
    const inp = $('#ch-in'); const text = inp.value.trim(); if (!text) return;
    inp.value = '';
    state.chat.msgs.push({ role: 'user', content: text });
    renderMsgs();
    if (state.chat.wf && state.chat.wf.paused) { confirmContinue(text); return; }
    addWait('menyusun rencana...');
    let plan = null;
    try { const pr = await api('/plan?message=' + encodeURIComponent(text)); plan = pr.structuredContent || pr; } catch (e) {}
    removeWait();
    if (plan && plan.steps && plan.steps.length > 1) {
      let project = state.active || undefined;
      if (!project) {
        try { const prr = await api('/projects/resolve', { hint: text }); const ps = prr.structuredContent || prr; if (ps.resolved && ps.project) project = ps.project; } catch (e) {}
      }
      state.chat.wf = { steps: plan.steps, idx: 0, ctx: '', project, paused: false, mode: state.chat.mode };
      state.chat.msgs.push({ role: 'assistant', content: 'Workflow otomatis (' + (state.chat.mode === 'approval' ? 'mode approval' : 'mode otomatis') + '): ' + plan.steps.map(s => s.agent).join(' → ') + (project ? ('\nProject: ' + project) : ''), meta: 'workflow · ' + (plan.reason || '') });
      renderMsgs();
      wfRun();
      return;
    }
    await singleChat(text);
  }
  $('#ch-send').addEventListener('click', send);
  $('#ch-in').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
}
